name: Update pricing

on:
  push:
    paths:
      - "pricing/tarife.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install parser dependency
        run: npm install xlsx --no-save

      - name: Generate pricing.json
        run: node update-pricing.cjs

      - name: Commit updated pricing.json
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add pricing.json
          git commit -m "update pricing" || echo "no changes"
          git push
