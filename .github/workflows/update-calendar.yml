name: Update calendar

on:
  schedule:
    # din ora in ora, la minutul 17 (ora fixa e aglomerata pe GitHub si rularile se amana)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update calendar
        env:
          ICS_BOOKING: ${{ secrets.ICS_BOOKING }}
          ICS_AIRBNB: ${{ secrets.ICS_AIRBNB }}
          ICS_TRAVELMINIT: ${{ secrets.ICS_TRAVELMINIT }}
        run: node update-calendar.cjs

      - name: Save updated calendar
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add booked-dates.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update calendar"
          git pull --rebase
          git push
