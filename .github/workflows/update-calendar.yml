name: Update calendar

# Rularea orara o porneste Worker-ul Cloudflare a13-panou (workflow_dispatch, cand ultima rulare e mai veche de 55 min):
# programarea GitHub de mai jos ruleaza in realitate doar de 4-6 ori pe zi. Ea ramane ca rezerva.
on:
  schedule:
    # din ora in ora, la minutul 17 (ora fixa e aglomerata pe GitHub si rularile se amana)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      allow_empty:
        description: "Surse acceptate cu calendar gol (ex. Booking) — doar daca golirea e reala"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# Niciodata doua rulari in acelasi timp (a doua asteapta).
concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Rularea programata vine la intamplare (GitHub o amana): daca o rulare reusita a fost acum mai putin de
      # 30 de minute (de obicei cea pornita de Worker), nu mai repetam totul.
      - name: Skip if the calendar was just updated
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-calendar.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 1800 ]; then
            echo "Ultima rulare reusita: $last (acum mai putin de 30 min) — rularea programata se opreste aici."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.recent.outputs.skip != '1'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.recent.outputs.skip != '1'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update calendar
        id: calendar
        if: steps.recent.outputs.skip != '1'
        env:
          ICS_BOOKING: ${{ secrets.ICS_BOOKING }}
          ICS_AIRBNB: ${{ secrets.ICS_AIRBNB }}
          ICS_TRAVELMINIT: ${{ secrets.ICS_TRAVELMINIT }}
          ICS_DIRECT: ${{ secrets.ICS_DIRECT }}
          CALENDAR_ALLOW_EMPTY: ${{ github.event.inputs.allow_empty }}
        run: node update-calendar.cjs

      - name: Save updated calendar
        if: steps.recent.outputs.skip != '1'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add booked-dates.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update calendar"
          git pull --rebase
          git push

      # Calendar gol suspect (zilele ocupate au fost pastrate si salvate mai sus) sau automatizarea din Apps Script
      # oprita (X-A13-LAST-SYNC prea vechi in „A13 Direct”): rularea apare ca esuata, ca sa vina notificarea.
      # Vezi Annotations pentru detalii.
      - name: Fail if a calendar came back empty or the automation stopped
        if: steps.calendar.outputs.suspicious == '1'
        env:
          REASON: ${{ steps.calendar.outputs.reason }}
        run: |
          echo "::error::${REASON:-Un calendar a venit gol; zilele ocupate au fost pastrate.}"
          exit 1

      # Rulare esuata -> mesaj pe Telegram (botul A13). Fara secretele TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID nu face nimic.
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.calendar.outputs.reason }}
          QUIET: ${{ steps.calendar.outputs.quiet }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          text="⚠️ GitHub: „${WORKFLOW}” a eșuat."
          if [ -n "$REASON" ]; then text="${text}"$'\n'"${REASON}"; fi
          curl -s -o /dev/null --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "disable_notification=${QUIET:-false}" \
            --data-urlencode "text=${text}"$'\n'"Detalii: ${RUN_URL}" || true
