name: Optimize images

on:
  push:
    paths:
      - "images/**/*.jpg"
      - "images/**/*.jpeg"
      - "hero-apartament.jpg"
      - "optimize-images.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install sharp --no-save

      - name: Generate WebP variants
        run: node optimize-images.cjs

      - name: Commit WebP files
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- '*.webp' images/gallery.json
          git commit -m "optimize images (webp)" || echo "no changes"
          git pull --rebase
          git push

      # Rulare esuata -> mesaj pe Telegram (botul A13). Fara secretele TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID nu face nimic.
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ GitHub: „${WORKFLOW}” a eșuat. Detalii: ${RUN_URL}" || true
