name: Test Telegram

# Doar manual (Actions -> Test Telegram -> Run workflow): verifica secretele TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
# folosite de pasul "Notify Telegram on failure" din celelalte workflow-uri, trimitand un mesaj de proba botului A13.
# Spre deosebire de acel pas (care tace la eroare), aici rularea esueaza daca Telegram refuza mesajul.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Lipsesc secretele TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID."
            exit 1
          fi
          code=$(curl -s --max-time 20 -o response.json -w '%{http_code}' -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ GitHub: alertele pentru rulările eșuate ajung aici. Detalii: ${RUN_URL}") || code=000
          if [ "$code" != "200" ]; then
            echo "::error::Telegram a raspuns $code: $(cat response.json 2>/dev/null)"
            exit 1
          fi
          echo "Mesaj trimis."
